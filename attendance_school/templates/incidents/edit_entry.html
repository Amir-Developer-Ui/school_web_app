
{% extends 'base.html' %}

{% block title %}ویرایش مورد ثبت وقایع{% endblock %}

{% block content %}
<div class="incident-page">

    <div class="page-head">
        <div>
            <p class="eyebrow">مدیریت انضباطی هنرستان</p>
            <h1>ویرایش اطلاعات</h1>
            <p class="muted">اطلاعات ثبت‌شده دانش‌آموز را ویرایش کن.</p>
        </div>

        <a href="{% url 'incident_detail' sheet.id %}" class="btn secondary">
            بازگشت
        </a>
    </div>

    <section class="panel">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="student_name">نام و نام خانوادگی</label>
                <input
                    type="text"
                    id="student_name"
                    name="student_name"
                    value="{{ entry.student_name }}"
                    maxlength="180"
                    required
                >
            </div>

            <div class="form-group">
                <label for="grade">پایه تحصیلی</label>
                <select id="grade" name="grade" required>
                    {% for value, label in grades %}
                        <option value="{{ value }}" {% if entry.grade == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="major">رشته تحصیلی</label>
                <select id="major" name="major" required>
                    {% for value, label in majors %}
                        <option value="{{ value }}" {% if entry.major == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="disciplinary_notes">موارد انضباطی</label>
                <textarea
                    id="disciplinary_notes"
                    name="disciplinary_notes"
                    rows="4"
                >{{ entry.disciplinary_notes }}</textarea>
            </div>

            <div class="form-group">
                <label for="follow_up">پیگیری</label>
                <textarea
                    id="follow_up"
                    name="follow_up"
                    rows="3"
                >{{ entry.follow_up }}</textarea>
            </div>

            <button type="submit" class="btn primary">
                ذخیره تغییرات
            </button>
        </form>
    </section>

</div>
{% endblock %}
